name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # ubuntu = 실제 배포 환경(Vercel)과 같은 Linux, windows = 팀원 PC와 같은 환경.
    # 한쪽이 실패해도 다른 쪽은 끝까지 돌려 결과를 비교한다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        # 두 환경에서 같은 방식으로 명령을 실행한다 (Windows 기본값인 PowerShell 대신 bash)
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 검사 (ESLint)
        run: pnpm lint

      - name: 모양 검사 (Prettier)
        run: pnpm format:check

      - name: 타입 검사
        run: pnpm typecheck

      - name: 단위 테스트 (Vitest)
        run: pnpm test

      - name: 빌드
        run: pnpm build

      - name: 화면 테스트 (Playwright)
        timeout-minutes: 12
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
